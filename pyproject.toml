[project]
name = "which-penguin"
version = "0.1.0"
description = "Predicting Palmer penguin species from body measurements with a production-style scikit-learn pipeline"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
